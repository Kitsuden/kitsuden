ion:none!important}}</style>
<rect x="1" y="1" width="1198" height="458" rx="28" fill="#0f1520" stroke="#2a3446" stroke-width="2"/>
<line x1="416" y1="34" x2="416" y2="388" stroke="#2a3446" stroke-width="2"/>
<line x1="792" y1="34" x2="792" y2="388" stroke="#2a3446" stroke-width="2"/>
<line x1="56" y1="404" x2="1144" y2="404" stroke="#2a3446" stroke-width="2"/>
<circle cx="62" cy="60" r="6" fill="#7ab4ff"/><text class="s" x="78" y="66" font-size="18" font-weight="700" fill="#f1f5f9">Your agent</text>
<circle cx="446" cy="60" r="6" fill="#f1f5f9"/><text class="s" x="462" y="66" font-size="18" font-weight="700" fill="#f1f5f9">Kitsuden</text>
<circle cx="822" cy="60" r="6" fill="#ff5a36"/><text class="s" x="838" y="66" font-size="18" font-weight="700" fill="#f1f5f9">You</text>
<g style="opacity:1;animation:k0 16s linear infinite"><text class="m" x="56" y="112" font-size="17" fill="#7ab4ff">DELETE /api/notes/notes/42</text></g>
<g style="opacity:1;animation:k1 16s linear infinite"><text class="m" x="56" y="138" font-size="14" fill="#a8b3c4">Bearer kitsuden_agent_7f3a…</text></g>
<g style="opacity:0;animation:k2 16s linear infinite"><rect x="56" y="166" width="3" height="56" fill="#fbbf24"/><text class="m" x="72" y="184" font-size="15" fill="#f1f5f9">202 pending approval</text><text class="m" x="72" y="208" font-size="14" fill="#a8b3c4">stored as a proposal, not run</text></g>
<g style="opacity:1;animation:k3 16s linear infinite"><rect x="56" y="166" width="3" height="56" fill="#34d399"/><text class="m" x="72" y="184" font-size="15" fill="#f1f5f9">200 executed</text><text class="m" x="72" y="208" font-size="14" fill="#a8b3c4">ran once, as notes-bot</text></g>
<rect x="440" y="92" width="328" height="46" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="486" y="120" font-size="15" font-weight="600" fill="#a8b3c4">Key</text><g style="opacity:1;animation:k4 16s linear infinite"><rect x="440" y="92" width="328" height="46" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="m" x="458" y="121" font-size="18" font-weight="700" fill="#34d399">✓</text><text class="s" x="486" y="112" font-size="15" font-weight="600" fill="#f1f5f9">Key</text><text class="s" x="486" y="130" font-size="13" fill="#a8b3c4">notes-bot, active</text></g>
<rect x="440" y="148" width="328" height="46" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="486" y="176" font-size="15" font-weight="600" fill="#a8b3c4">Scope</text><g style="opacity:1;animation:k5 16s linear infinite"><rect x="440" y="148" width="328" height="46" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="m" x="458" y="177" font-size="18" font-weight="700" fill="#34d399">✓</text><text class="s" x="486" y="168" font-size="15" font-weight="600" fill="#f1f5f9">Scope</text><text class="s" x="486" y="186" font-size="13" fill="#a8b3c4">has note:write</text></g>
<rect x="440" y="204" width="328" height="46" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="486" y="232" font-size="15" font-weight="600" fill="#a8b3c4">Row security</text><g style="opacity:1;animation:k6 16s linear infinite"><rect x="440" y="204" width="328" height="46" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="m" x="458" y="233" font-size="18" font-weight="700" fill="#34d399">✓</text><text class="s" x="486" y="224" font-size="15" font-weight="600" fill="#f1f5f9">Row security</text><text class="s" x="486" y="242" font-size="13" fill="#a8b3c4">note 42 is its owner's</text></g>
<rect x="440" y="260" width="328" height="46" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="486" y="288" font-size="15" font-weight="600" fill="#a8b3c4">Sign-off</text><g style="opacity:0;animation:k7 16s linear infinite"><rect x="440" y="260" width="328" height="46" rx="9" fill="#161e2c" stroke="#fbbf24" stroke-width="2"/><text class="m" x="458" y="289" font-size="18" font-weight="700" fill="#fbbf24">…</text><text class="s" x="486" y="280" font-size="15" font-weight="600" fill="#f1f5f9">Sign-off</text><text class="s" x="486" y="298" font-size="13" fill="#a8b3c4">a delete waits for a person</text></g><g style="opacity:1;animation:k8 16s linear infinite"><rect x="440" y="260" width="328" height="46" rx="9" fill="#161e2c" stroke="#34d399" stroke-width="2"/><text class="m" x="458" y="289" font-size="18" font-weight="700" fill="#34d399">✓</text><text class="s" x="486" y="280" font-size="15" font-weight="600" fill="#f1f5f9">Sign-off</text><text class="s" x="486" y="298" font-size="13" fill="#a8b3c4">approved by you</text></g>
<g transform="rotate(-5 604 350)"><g style="transform-box:fill-box;transform-origin:center;opacity:0;animation:k9 16s linear infinite"><rect x="506" y="329" width="196" height="42" rx="8" fill="#0f1520" stroke="#fbbf24" stroke-width="4"/><text class="m" x="604" y="358" font-size="21" font-weight="800" letter-spacing="2" fill="#fbbf24" text-anchor="middle">202 WAITING</text></g></g>
<g transform="rotate(-5 604 350)"><g style="transform-box:fill-box;transform-origin:center;opacity:1;animation:k10 16s linear infinite"><rect x="538" y="329" width="132" height="42" rx="8" fill="#0f1520" stroke="#34d399" stroke-width="4"/><text class="m" x="604" y="358" font-size="21" font-weight="800" letter-spacing="2" fill="#34d399" text-anchor="middle">200 OK</text></g></g>
<g style="opacity:0;animation:k11 16s linear infinite"><rect x="816" y="92" width="328" height="46" rx="9" fill="none" stroke="#2a3446" stroke-width="2" stroke-dasharray="6 6"/><text class="s" x="834" y="121" font-size="15" fill="#a8b3c4">Nothing is waiting for you.</text></g>
<g style="opacity:1;animation:k12 16s linear infinite"><rect x="816" y="92" width="328" height="178" rx="12" fill="#161e2c" stroke="#fbbf24" stroke-width="2"/><text class="s" x="836" y="124" font-size="16" fill="#f1f5f9"><tspan font-weight="700">notes-bot</tspan> wants to delete a note.</text><rect x="836" y="140" width="288" height="34" rx="7" fill="#3a2230"/><text class="m" x="850" y="162" font-size="14" fill="#f1f5f9">− 42 · Old draft</text><rect x="836" y="194" width="138" height="52" rx="9" fill="#ff5a36"/><text class="s" x="905" y="226" font-size="16" font-weight="700" fill="#0f1520" text-anchor="middle">Approve</text><rect x="986" y="194" width="138" height="52" rx="9" fill="none" stroke="#2a3446" stroke-width="2"/><text class="s" x="1055" y="226" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Reject</text></g>
<g style="opacity:0;animation:k13 16s linear infinite"><rect x="832" y="190" width="146" height="60" rx="12" fill="none" stroke="#f1f5f9" stroke-width="3"/></g>
<g transform="rotate(-8 1040 214)"><g style="transform-box:fill-box;transform-origin:center;opacity:1;animation:k14 16s linear infinite"><rect x="965" y="193" width="150" height="42" rx="8" fill="#0f1520" stroke="#ff5a36" stroke-width="4"/><text class="m" x="1040" y="222" font-size="21" font-weight="800" letter-spacing="2" fill="#ff5a36" text-anchor="middle">APPROVED</text></g></g>
<g style="opacity:1;animation:k15 16s linear infinite"><text class="s" x="816" y="312" font-size="14" font-weight="700" fill="#f1f5f9">Audit log</text><text class="m" x="816" y="336" font-size="13" fill="#a8b3c4">you approved · notes-bot</text><text class="m" x="816" y="356" font-size="13" fill="#a8b3c4">deleted note 42</text></g>
<g style="opacity:0;animation:k16 16s linear infinite"><text class="s" x="56" y="438" font-size="19" fill="#f1f5f9">An agent asks to delete a note, with its own key.</text></g>
<g style="opacity:0;animation:k17 16s linear infinite"><text class="s" x="56" y="438" font-size="19" fill="#f1f5f9">With approvals on, Kitsuden does not run it: a delete waits for a person.</text></g>
<g style="opacity:1;animation:k18 16s linear infinite"><text class="s" x="56" y="438" font-size="19" fill="#f1f5f9">You approve. It runs once, and the decision is in the audit log.</text></g>
</svg>
