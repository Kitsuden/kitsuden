<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">How Kitsuden holds an agent's delete until a person approves it</title>
<desc id="d">Animation in three lanes. Your agent sends DELETE /api/notes/notes/42 with its own kitsuden_agent key. Kitsuden checks the key, the scope and row security, and because approvals are on, the delete waits for a person: the agent gets 202 pending approval and nothing runs. You see the proposal with what would be deleted, approve it, and it runs once as the agent; the decision is written to the audit log.</desc>
