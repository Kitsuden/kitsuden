<text class="s" x="64" y="206" font-size="20" fill="#a8b3c4">each with its own <tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="#ff8a4c">kitsuden_agent_*</tspan> key and scopes</text>
