<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" width="1200" height="848" role="img" aria-labelledby="t d">
<title id="t">How a request flows through Kitsuden</title>
<desc id="d">AI agents such as Claude, Cursor or your own connect over MCP at /api/mcp or REST under /api with their own kitsuden_agent_* key and scopes; people use the SvelteKit admin panel over REST with a session. Every request reaches the Kitsuden API, Hono on Bun, which is deny by default and checks scopes (a union where a deny wins), human approval (sensitive requests become a 202 proposal), quotas and idempotent retries, and writes an audit log. Kons plug into the API. Each request runs in one transaction with its row-level security context in PostgreSQL 16 with pgvector, which also holds the outbox queue. Valkey is optional, for several API replicas.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
