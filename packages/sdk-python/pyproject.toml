[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitsuden"
version = "0.9.0b0"
description = "Typed Python client for Kitsuden (sync and async, generated from its OpenAPI 3.1): every kon operation, approvals, idempotency, TOON/TRON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Victor Antinori Broce" }]
keywords = ["kitsuden", "baas", "backend", "sdk", "api-client", "ai", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# httpx and nothing else, on purpose: an SDK that drags in half of PyPI is an SDK
# that generates dependency conflicts in the user's project.
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Kitsuden/kitsuden"

[tool.hatch.build.targets.wheel]
# Includes kitsuden/_generated (the typed operations) and kitsuden/py.typed.
packages = ["kitsuden"]

[tool.hatch.build.targets.sdist]
include = ["kitsuden", "tests", "README.md", "pyproject.toml"]
exclude = ["**/__pycache__"]
