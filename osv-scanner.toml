# picomatch: ReDoS when an ATTACKER supplies the glob pattern (`+(*)`, `+(*a)`). Every release up to
# 4.0.7, the latest, is affected: there is nothing to bump to yet. Approved by the owner on 2026-11-17.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-17
reason = "No patched release yet. No Kitsuden code imports picomatch or another glob library, and no glob pattern comes from a request. It arrives through build and test tooling (vite, vitest, tsup, eslint, lint-staged), through unstorage's file-watch driver (pulled by hono-rate-limiter and never loaded) and through Astro in the starter, whose patterns come from astro.config. The CLI's unused chokidar dependency was removed. Bump as soon as a fix ships."
