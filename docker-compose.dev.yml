# ═══════════════════════════════════════════════════════════════════════════
# Kitsuden — Infrastructure for DEVELOPMENT
#
# Services:
#   - PostgreSQL 16 + pgvector
#   - SeaweedFS (S3-compatible storage)
#   - Valkey (Redis-compatible cache)
#
# USAGE:
#   docker compose -f docker-compose.dev.yml up -d
#
# NOTE: The applications run LOCALLY (pnpm dev), not in Docker.
#       Only the infrastructure runs in containers.
# ═══════════════════════════════════════════════════════════════════════════

# Ports only on 127.0.0.1, as in docker-compose.yml. To open them to the network,
# `BIND_ADDRESS=0.0.0.0` in `.env`.

services:
  # ═══════════════════════════════════════════════════════════════════════
  # PostgreSQL 16 with pgvector
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_db:
    image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    container_name: ${KITSUDEN_INSTANCE:-kitsuden}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitsuden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kitsuden_dev}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kitsuden_postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitsuden} -d ${POSTGRES_DB:-kitsuden_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kitsuden_net

  # ═══════════════════════════════════════════════════════════════════════
  # SeaweedFS (S3-compatible storage), same setup as docker-compose.yml.
  # docker/seaweedfs-startup.sh writes the S3 identities: without them SeaweedFS
  # lets anyone in. S3 on MINIO_PORT, its panel on MINIO_CONSOLE_PORT.
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    container_name: ${KITSUDEN_INSTANCE:-kitsuden}_seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kitsuden/startup.sh"]
    environment:
      # ⚠️ REQUIRED. Set S3_ACCESS_KEY and S3_SECRET_KEY in .env
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required - set it in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required - set it in .env}
      S3_BUCKET: ${S3_BUCKET:-kitsuden-media}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:8333"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:23646"
    volumes:
      - kitsuden_seaweedfs_data:/data
      - ./docker/seaweedfs-startup.sh:/kitsuden/startup.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kitsuden_net

  # ═══════════════════════════════════════════════════════════════════════
  # Valkey (Redis-compatible) OPTIONAL: cache and Pub/Sub shared between replicas. The queue lives in Postgres.
  # ═══════════════════════════════════════════════════════════════════════
  kitsuden_cache:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: ${KITSUDEN_INSTANCE:-kitsuden}_cache
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    volumes:
      - kitsuden_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kitsuden_net

volumes:
  kitsuden_postgres_data:
    name: ${KITSUDEN_INSTANCE:-kitsuden}_postgres_data
    driver: local

  kitsuden_seaweedfs_data:
    name: ${KITSUDEN_INSTANCE:-kitsuden}_seaweedfs_data
    driver: local

  kitsuden_valkey_data:
    name: ${KITSUDEN_INSTANCE:-kitsuden}_valkey_data
    driver: local

networks:
  kitsuden_net:
    name: ${KITSUDEN_INSTANCE:-kitsuden}_net
    driver: bridge
