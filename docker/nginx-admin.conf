server {
    # 8080: the image runs nginx without root (docker/Dockerfile.prod).
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ===================================================================
    # Content-Security-Policy of the panel
    #
    #   script-src 'unsafe-inline'  NOT what protects scripts. The panel's build
    #                               puts a second policy in a <meta> (kit.csp in
    #                               packages/admin/svelte.config.js) with the hash
    #                               of the one inline script that starts the app.
    #                               A browser enforces EVERY policy it gets, so an
    #                               inline script must pass both: only that one
    #                               does. This header cannot know the hash (it
    #                               changes with each build), hence the keyword.
    #   no 'unsafe-eval'            Calculated fields use a parser
    #                               (lib/components/calculated-fields/evaluate.ts).
    #   style-src 'unsafe-inline'   Svelte style attributes and transitions.
    #   fonts.googleapis/gstatic    The panel's fonts (assets/main.css).
    #   frame-src 'self'            Live previews are srcdoc iframes.
    #   connect-src 'self'          The panel only talks to its own origin (/api is
    #                               proxied below). A build with VITE_API_URL or
    #                               KITSUDEN_PANEL_CONNECT_SRC puts those hosts in
    #                               the <meta>; add them here too if you use them.
    #   img-src/media-src https:    Media can live on any S3-compatible host.
    #
    # Keep docker/Caddyfile in sync. /api/ is left out on purpose: the API sets its
    # own headers, and Swagger and the OAuth consent page are not this app.
    # ===================================================================
    set $panel_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    # ===================================================================
    # Reverse Proxy: /api/* -> API container (internal Docker network)
    #
    # This makes the browser see a SINGLE origin (same host:port) for
    # both the SPA and the API. Cookies work without cross-origin issues.
    # The API container does NOT need to be exposed to the host.
    # ===================================================================
    # `^~` is NOT decorative: without it, this rule LOSES.
    #
    # In nginx a regex `location` beats a prefix one. Further
    # down there is `location ~* \.(js|css|png|...)$` to cache the SPA's static
    # files, and that regex captured any API URL ending in `.js`.
    #
    # The result: the Web Components that kons provide, served by the API
    # at `/api/kons/<kon>/admin-asset/...js`, were looked up on the admin's disk,
    # where they are not, and returned 404. Through the API port they answered 200,
    # so it looked like a problem of the browser or the view loader.
    #
    # `^~` tells nginx: if the prefix matches, stop looking at regexes.
    location ^~ /api/ {
        proxy_pass http://kitsuden_api:3000;
        proxy_http_version 1.1;

        # WebSocket support (for /api/realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info to the API.
        # $http_host keeps the port: the API compares it with the browser's Origin
        # to recognize the panel behind this proxy (write-origin.ts), and
        # $host drops it, so the panel at http://127.0.0.1:3001 failed that check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (file uploads, SSE)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Don't buffer responses (important for SSE/streaming)
        proxy_buffering off;

        # Allow large file uploads (media library)
        client_max_body_size 100m;

        # Declaring one add_header here stops the server-level ones from applying,
        # which keeps the panel's CSP off the API's responses.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ===================================================================
    # Gzip compression
    # ===================================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ===================================================================
    # Cache static assets (SvelteKit build hashes filenames)
    # ===================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx does NOT inherit the server's `add_header` in a location that
        # declares its own: without repeating them here, static files (the SVG included)
        # went out without nosniff or X-Frame-Options.
        add_header Content-Security-Policy $panel_csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ===================================================================
    # SPA fallback — all non-file routes go to index.html
    # ===================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===================================================================
    # Security headers
    # ===================================================================
    add_header Content-Security-Policy $panel_csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
