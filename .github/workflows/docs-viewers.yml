name: Documentation viewers

# The API serves its own copies of Swagger UI, Scalar and RapiDoc, pinned in
# apps/api/src/lib/docs-viewers.json (docs/api-contract.md). Dependabot does not read
# that file, so once a month this says which ones have a newer release. A red run means
# "look at it": read the release notes and security advisories before moving the pin.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated:
    name: Newer releases of the pinned viewers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Compare the pins with npm
        run: node scripts/docs-viewers.mjs --outdated --summary="$GITHUB_STEP_SUMMARY"
