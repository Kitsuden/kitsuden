name: CI - Quality Checks

# ── WHEN IT RUNS ────────────────────────────────────────────────────────────
#
# On ANY branch, not just main/develop. Tags do not: the publishing workflows
# call this one (workflow_call) before publishing.
#
# ── WHAT ALL THE JOBS NEED ─────────────────────────────────────────────────
#
#   · pnpm 9.15.4 (the one in the lockfile and in `packageManager`).
#   · Node 22: the neutral starter requires 22.12+, and its Astro 22.23.4+.
#   · Bun in ALL the jobs that install: the `prepare` of @kitsuden/shared
#     builds with bun (`bun run scripts/build.ts`), and without bun `pnpm install`
#     fails on a clean clone, before reaching any step.
#   · `svelte-kit sync` before the panel's lint and tests: it generates
#     `packages/admin/.svelte-kit/tsconfig.json`, which the panel's tsconfig
#     extends. It does not exist on a clean clone.
on:
  push:
    # Dependabot branches run once, as a pull request, not twice
    branches: ["**", "!dependabot/**"]
  pull_request:
    branches: [main, develop]
  # By hand (Actions → Run workflow): used by the aig-red-team job
  workflow_dispatch:
  # publish.yml and docker-publish.yml: the gate before publishing
  workflow_call:

# Read-only repo access for GITHUB_TOKEN: no job writes to GitHub, and without
# this the token inherited the repository's default permissions. The buildx
# `type=gha` cache does not use this token.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"
  # Bun pinned, not `latest`: a new bun version changed the CI result
  # with no commit. 1.3.14 is the one in the images and the @types/bun one in the lockfile.
  BUN_VERSION: "1.3.14"

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types (admin)
        run: pnpm --filter @kitsuden/admin exec svelte-kit sync

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm run typecheck:core

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    # The API suite requires both: KITSUDEN_TEST_DB=postgres to use the
    # service's database (without it, it tries pg-mem and part of the tests do not
    # apply), and a BETTER_AUTH_SECRET of 32+ characters (without it better-auth
    # does not start). The secret is fake and only valid in this job.
    env:
      DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      KITSUDEN_TEST_DB: postgres
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The schema is built from SCRATCH on every push, applying the full
      # migration chain against real Postgres: if a migration does not
      # apply on a clean database, the push fails here and not in production.
      - name: Apply migrations + RLS
        working-directory: apps/api
        run: bun run scripts/migrate.ts

      # Second pass: a migration that is not idempotent breaks any
      # deployment that gets retried. Nothing new should be applied here.
      # The pattern is that of the migrations line («Applying N migration(s)»),
      # not the bare word: «Applying RLS policies» appears in EVERY pass.
      - name: Verify migrations are idempotent
        working-directory: apps/api
        run: |
          output=$(bun run scripts/migrate.ts)
          echo "$output"
          if echo "$output" | grep -Eq "Applying [0-9]+ migration"; then
            echo "::error::The second pass applied migrations: the chain is not idempotent."
            exit 1
          fi

      # That migrations apply does not mean the schema is what the
      # code expects (tables declared in Drizzle with no migration that creates them).
      - name: Verify declared schema exists
        working-directory: apps/api
        run: bun run scripts/verify-schema.ts

      # ALL registered GET routes are requested and none is allowed to return
      # 5xx. A 401 or a 404 is fine; a 500 means the server could not
      # serve its own route.
      - name: Route smoke test (none may return 5xx)
        working-directory: apps/api
        run: bun run scripts/smoke-routes.ts

      # Integration in one process (they share a database) and unit tests one process per
      # file: their `mock.module` applies to the whole process and in a batch the
      # result depended on order (see apps/api/scripts/isolated-test.mjs).
      # The academy test needs kon-academy-lms, which a clean clone does not have.
      - name: Run API integration tests
        working-directory: apps/api
        run: bun test src/tests/ --path-ignore-patterns='**/academy-supervisor-by-groups.test.ts'

      - name: Run API unit tests (one process per file)
        working-directory: apps/api
        run: node scripts/isolated-test.mjs

  # The API started with NODE 22+, no Bun at runtime and WITHOUT Valkey:
  # src/node-server.ts built with --target node.
  # Bun is only needed to build. If a native module or a Bun API
  # slips into the startup path, it fails here and not the day Node is needed.
  api-on-node:
    name: API on Node 22 (no Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_test
      NODE_ENV: development
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://127.0.0.1:3100
      PORT: "3100"
      HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        working-directory: apps/api
        run: bun run scripts/migrate.ts
      - name: Build for Node
        working-directory: apps/api
        run: pnpm run build:node
      - name: Start on Node and check health
        working-directory: apps/api
        run: |
          node --version
          node dist-node/node-server.js > node.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/api/health > health.json 2>/dev/null; then break; fi
            sleep 2
          done
          cat health.json || (cat node.log; exit 1)
          grep -q '"database":{"status":"ok"' health.json || (cat node.log; exit 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/realtime)
          test "$code" = "501"

  # Schemathesis against the SDK contract (apps/api/scripts/schemathesis.ts):
  # generates thousands of requests from each operation's schemas and fails on
  # 500s, responses that do not match what is declared, or undocumented statuses. The
  # ALREADY KNOWN failures are in apps/api/schemathesis-baseline.json: only
  # a new one fails the job. SEPARATE job with its own database: the
  # integration suite empties the datasets (`clearTestData`) and would delete its data
  # mid-run. Schemathesis is not a dependency: it runs with uvx, pinned version.
  # Only the core kons are here (the rest live in kitsuden-kons).
  schemathesis:
    name: Schemathesis (SDK contract)
    runs-on: ubuntu-latest
    # Non-blocking for now: it generates random requests, so a run can fail on a
    # new input with no code change, and it has not been run in this repository's
    # CI yet. A failure here is still a real 500 or a broken contract: fix it, or
    # accept it on purpose with `--baseline-update`. Make it blocking once it has
    # been stable for a while.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_schemathesis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_schemathesis_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      KITSUDEN_TEST_DB: postgres
      LOG_LEVEL: error
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations + RLS
        working-directory: apps/api
        run: bun run scripts/migrate.ts

      - name: Run Schemathesis
        working-directory: apps/api
        run: bun run scripts/schemathesis.ts

      - name: Upload Schemathesis report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schemathesis-report
          path: apps/api/.schemathesis/
          retention-days: 14

  # ── Red-teaming the MCP with AI-Infra-Guard (Tencent Zhuque Lab, Apache-2.0) ──
  # NOT blocking: an LLM audits the MCP server code, the kons and the
  # skill, and its findings are opinions that must be reviewed by hand. It only runs if
  # the LLM_API_KEY secret exists, and only on push to main or by hand: each run
  # sends the code to the LLM endpoint and costs money
  # (docs/agents/red-teaming.md). Versions pinned in scripts/security/aig.mjs.
  # The AIG web interface is NEVER deployed: it has no authentication.
  #
  # The SARIF is not uploaded as an artifact: on a public repository anyone could
  # download unreviewed vulnerability findings. Run it by hand to read them.
  aig-red-team:
    name: AI-Infra-Guard (MCP + skill, non-blocking)
    runs-on: ubuntu-latest
    if: github.workflow == 'CI - Quality Checks' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    continue-on-error: true
    timeout-minutes: 60
    env:
      # Optional (repo variables): OpenAI-compatible endpoint and model
      AIG_BASE_URL: ${{ vars.AIG_BASE_URL }}
      AIG_MODEL: ${{ vars.AIG_MODEL }}
    steps:
      - name: Is there an LLM key?
        id: llm_key
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::LLM_API_KEY not configured: skipping the scan"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.llm_key.outputs.present == 'true'
      # kitsuden-kons lives in another repository: only if the variable names it
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.llm_key.outputs.present == 'true' && vars.KITSUDEN_KONS_REPO != ''
        with:
          repository: ${{ vars.KITSUDEN_KONS_REPO }}
          token: ${{ secrets.KITSUDEN_KONS_TOKEN || github.token }}
          path: kitsuden-kons
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.llm_key.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.llm_key.outputs.present == 'true'
        with:
          version: "0.9.8"
      - name: AI-Infra-Guard
        if: steps.llm_key.outputs.present == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          KITSUDEN_KONS_DIR: ${{ github.workspace }}/kitsuden-kons/kons
        run: |
          targets=code,skill
          if [ -d kitsuden-kons/kons ]; then targets=code,skill,kons; fi
          node scripts/security/aig.mjs --target=$targets

  test-admin:
    name: Admin + repo guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types (admin)
        run: pnpm --filter @kitsuden/admin exec svelte-kit sync

      - name: Run Vitest tests (admin)
        working-directory: packages/admin
        run: pnpm test

      # The ROOT suite — `tests/unit/**` — is the set of guard tests
      # that keep whole classes of failure from coming back: shadowed routes,
      # tables without a migration, panel links to a 404, startup scripts
      # that never finish. Those that depend on something not in the repo (the
      # sibling Inti repo) skip themselves, saying why.
      - name: Run repo guard tests
        run: pnpm run test:unit

      # Kon install safety and the signed registry, with the compiled CLI.
      - name: Run CLI tests
        run: pnpm run test:cli

  # The same checks on macOS: everything that needs no service container (GitHub's
  # macOS runners have no Docker). The jobs with Postgres stay on Linux. Actions
  # pinned to the same commits as publish.yml.
  macos:
    name: macOS (typecheck, unit and CLI tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types (admin)
        run: pnpm --filter @kitsuden/admin exec svelte-kit sync

      - name: Run TypeScript type check
        run: pnpm run typecheck:core

      - name: Run repo guard tests
        run: pnpm run test:unit

      - name: Run CLI tests
        run: pnpm run test:cli

  all-kons-migrations:
    name: Migrations of ALL kons
    runs-on: ubuntu-latest
    # The `test-api` job migrates the ENABLED kons. The rest are off by
    # default, so nobody ran their SQL until a user
    # enabled one from the panel. Here ALL of them are applied on an EMPTY database.
    # `--all-kons` is not used on a server: it is only a check.
    #
    # The database ends in `_test`: the scripts refuse to create the tables of all
    # the kons in a database that does not look like a test one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_kons_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # KITSUDEN_TEST_DB=postgres: with NODE_ENV=test and without it, src/db uses pg-mem
    # and the chain «is applied» to an in-memory database that is not Postgres.
    env:
      DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_kons_test
      NODE_ENV: test
      KITSUDEN_TEST_DB: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the chain of all kons from scratch
        working-directory: apps/api
        run: bun run scripts/migrate.ts --all-kons --no-rls

      - name: Check that the chain is idempotent
        working-directory: apps/api
        run: |
          output=$(bun run scripts/migrate.ts --all-kons --no-rls)
          echo "$output"
          if echo "$output" | grep -Eq "Applying [0-9]+ migration"; then
            echo "::error::The second pass applied migrations: the chain is not idempotent."
            exit 1
          fi

      - name: Verify the schema declared by each kon
        working-directory: apps/api
        run: bun run scripts/verify-schema.ts --all-kons

      # RLS last and on the full schema: ownership policies are
      # generated by walking the tables that exist.
      - name: Apply RLS over the full schema
        working-directory: apps/api
        run: bun run scripts/migrate.ts --all-kons

  # ── The neutral starter, WITHOUT Inti ──────────────────────────────────────
  #
  # It is the repo's example website: it must install and build without Inti
  # existing, and the bundle must not contain anything from `@intijs` (tests/build.test.mjs
  # inspects it; the build with Inti skips itself if it is not installed).
  starter-basic:
    name: Neutral starter (build without Inti)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (starter only)
        run: pnpm install --frozen-lockfile --filter "@kitsuden/starter-basic..."

      - name: Render tests of every block
        working-directory: packages/starters/kitsuden-starter-basic
        run: pnpm test

      - name: Build and inspect the bundle
        working-directory: packages/starters/kitsuden-starter-basic
        run: pnpm test:build

  # ── The neutral starter WITH Inti installed from git ───────────────────────
  #
  # READY AND TURNED OFF: the public Inti repository does not exist yet.
  # When it exists (Kitsuden/inti), remove the `if: false`. It installs
  # @intijs/core and @intijs/adapter-kitsuden from git, from the SAME commit, as
  # the starter's README explains, builds with INTI=true and runs the
  # adapter contract tests against this repo's reference responses.
  starter-with-inti:
    name: Neutral starter + Inti from git
    if: false
    runs-on: ubuntu-latest
    env:
      INTI_REPO: Kitsuden/inti
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.INTI_REPO }}
          path: inti
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Kitsuden (starter only)
        run: pnpm install --frozen-lockfile --filter "@kitsuden/starter-basic..."

      - name: Add Inti from git (same commit for core and adapter)
        working-directory: packages/starters/kitsuden-starter-basic
        run: |
          COMMIT=$(git -C ../../../inti rev-parse HEAD)
          pnpm add "github:${INTI_REPO}#${COMMIT}&path:/packages/core" \
                   "github:${INTI_REPO}#${COMMIT}&path:/packages/adapter-kitsuden"

      - name: Build with and without Inti
        working-directory: packages/starters/kitsuden-starter-basic
        run: pnpm test:build

      - name: Contract tests of the adapter (Inti side)
        working-directory: inti
        run: |
          npm ci
          bun test packages/adapter-kitsuden

  # ── Typed clients (TypeScript + Python) generated from the OpenAPI ─────────
  #
  # `pnpm sdk:check` fails when the committed clients are stale: regenerating
  # from the committed snapshot must give the same bytes, the TRON fixtures
  # must match the pinned library, and the snapshot must match the kon SDK
  # operations of the kons installed HERE (the kitsuden-kons ones are absent in
  # a clean clone and are reported as not checked). Fix: `pnpm sdk:openapi &&
  # pnpm sdk:generate` and commit. Then both mocked-server suites.
  sdk-clients:
    name: Typed clients (generated, TS + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated clients are up to date
        run: pnpm sdk:check

      - name: TypeScript client (mocked server)
        run: pnpm test:sdk:ts

      - name: Python client (mocked server, 3.9 and 3.12)
        working-directory: packages/sdk-python
        run: |
          for v in 3.9 3.12; do
            uv run --no-project --python "$v" --with "httpx>=0.24" --with pytest -- python -m pytest -q -p no:cacheprovider tests
          done

  # Both clients against a real API on the job's own Postgres (core kons only).
  sdk-clients-integration:
    name: Typed clients against a live API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_sdk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      KITSUDEN_SDK_IT_DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_sdk_test
      KITSUDEN_SDK_IT_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.8"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate, start the API, run both clients
        run: pnpm test:sdk:integration

  build-docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile.prod
          target: api
          push: false
          load: true
          tags: kitsuden-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Admin Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile.prod
          target: admin
          push: false
          load: true
          tags: kitsuden-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build MCP Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/mcp/Dockerfile
          target: production
          push: false
          load: true
          tags: kitsuden-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The example public website (the neutral starter)
      - name: Build Web Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          target: web
          push: false
          load: true
          tags: kitsuden-web:ci
          build-args: |
            SITE_URL=https://ci.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy: fails on a fixable HIGH or CRITICAL vulnerability in any image.
      # Exceptions in .trivyignore.yaml; docs/security-scanning.md.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan the images with Trivy
        run: >-
          node scripts/security/scan.mjs
          --image=kitsuden-api:ci --image=kitsuden-admin:ci
          --image=kitsuden-mcp:ci --image=kitsuden-web:ci

  # ── The deployment configuration (compose + Caddy) ─────────────────────────
  #
  # No secrets: a fake .env with values that are good for nothing. What
  # is checked is that `docker compose ... config` interpolates and that the
  # Caddyfile is valid.
  deploy-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker compose (local and production)
        run: |
          cat > /tmp/ci.env <<'EOF'
          COMPOSE_PROJECT_NAME=kitsuden
          POSTGRES_PASSWORD=ci-not-a-secret-ci-not-a-secret
          APP_DB_PASSWORD=ci-not-a-secret
          VALKEY_PASSWORD=ci-not-a-secret
          BETTER_AUTH_SECRET=ci-not-a-secret-ci-not-a-secret
          SITE_API_KEY=ci-not-a-secret
          SITE_DOMAIN=example.invalid
          ACME_EMAIL=ops@example.invalid
          EOF
          docker compose --env-file /tmp/ci.env -f docker-compose.yml config -q
          docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.tls.yml config -q
          REPLICATION_PASSWORD=ci-not-a-secret docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.replica.yml config -q
          # Nothing except Caddy may publish outside 127.0.0.1
          docker compose --env-file /tmp/ci.env -f docker-compose.yml -f docker-compose.tls.yml config --format json \
            | jq -e '[.services | to_entries[] | select(.key != "kitsuden_proxy") | .value.ports // [] | .[] | select((.host_ip // "") != "127.0.0.1")] | length == 0'

      - name: Validate docker/Caddyfile
        run: |
          docker run --rm -e SITE_DOMAIN=example.invalid -e KITSUDEN_DOMAIN=panel.example.invalid \
            -e ACME_EMAIL=ops@example.invalid -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: nginx-admin.conf syntax
        run: |
          docker run --rm --add-host kitsuden_api:127.0.0.1 \
            -v "$PWD/docker/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.29-alpine nginx -t

      - name: Syntax of the startup, backup and deployment scripts
        run: |
          sh -n docker/media-backup.sh
          sh -n docker/postgres-entrypoint.sh
          sh -n docker/wal-archive.sh
          sh -n docker/replica-entrypoint.sh
          bash -n docker/pitr-restore.sh
          sh -n docker/start-with-check.sh
          bash -n scripts/deploy.sh
          bash -n install.sh
