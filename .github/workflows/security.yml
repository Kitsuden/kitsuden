name: Security

# Security scanning. Docs: docs/security-scanning.md.
#
# Blocking on every push and pull request:
#   scanners  gitleaks (secrets in the history and the tree), OSV-Scanner (HIGH or
#             CRITICAL advisories in pnpm-lock.yaml) and Checkov (Dockerfiles and
#             workflows), all through scripts/security/scan.mjs: the same versions
#             and exceptions as on a laptop.
#   codeql    CodeQL static analysis (security-extended) of TypeScript/JavaScript,
#             Python and the workflows. Its alerts appear under Security → Code
#             scanning; to block a merge on them, require "CodeQL" in the branch rules.
#
# Only when the secret exists (they are paid or need an account):
#   ggshield  GitGuardian secret scanning (GITGUARDIAN_API_KEY). Blocking.
#   snyk      Snyk Open Source (SNYK_TOKEN). Not blocking: OSV is the gate.
#
# Weekly, on push to main and by hand (slow, so not on every branch):
#   zap       OWASP ZAP API scan of a live test API, driven by its OpenAPI.
#   owasp-dependency-check  OWASP Dependency-Check against the NVD (NVD_API_KEY).
#   Both not blocking for now: their first findings need triage (see the docs).
#
# Trivy scans the built Docker images in ci.yml (job build-docker), so the
# publishing gates cover them. publish.yml and docker-publish.yml call this workflow
# too: nothing is published unless the blocking jobs pass.

on:
  push:
    # Dependabot branches run once, as a pull request, not twice
    branches: ["**", "!dependabot/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Mondays 05:17 UTC: new advisories appear without a commit
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  UV_VERSION: "0.9.8"

jobs:
  scanners:
    name: Secrets, dependencies, IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history of the branch
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run the scanners
        run: node scripts/security/scan.mjs

      # Informational: AI-Infra-Guard's free regex pre-scan of the MCP server and the
      # skill (no LLM, nothing leaves the runner). Hits are patterns an MCP server is
      # expected to have; the full audit is the aig-red-team job in ci.yml.
      - name: AI-Infra-Guard pre-scan (informational)
        if: always()
        continue-on-error: true
        run: node scripts/security/aig.mjs --prescan-only --target=code,skill

      # Code scanning keeps findings visible to maintainers only. One upload per
      # report: code scanning refuses several runs under one category. Skipped on pull
      # requests from forks, whose token cannot write security events.
      - name: Upload gitleaks (history) to code scanning
        if: always() && hashFiles('.security/gitleaks-history.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security/gitleaks-history.sarif
          category: gitleaks-history
      - name: Upload gitleaks (tree) to code scanning
        if: always() && hashFiles('.security/gitleaks-tree.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security/gitleaks-tree.sarif
          category: gitleaks-tree
      - name: Upload OSV-Scanner to code scanning
        if: always() && hashFiles('.security/osv.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security/osv.sarif
          category: osv-scanner
      - name: Upload Checkov to code scanning
        if: always() && hashFiles('.security/checkov.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .security/checkov.sarif
          category: checkov

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - "**/dist"
              - "**/dist-node"
              - "**/*.test.ts"
              - tests
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-${{ matrix.language }}

  ggshield:
    name: GitGuardian (when GITGUARDIAN_API_KEY is set)
    runs-on: ubuntu-latest
    steps:
      - name: Is there a key?
        id: key
        env:
          KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de # v1.56.1
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  snyk:
    name: Snyk Open Source (when SNYK_TOKEN is set, not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Is there a token?
        id: key
        env:
          KEY: ${{ secrets.SNYK_TOKEN }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Pinned CLI from npm instead of snyk/actions, whose Docker images float.
      - name: snyk test
        if: steps.key.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx --yes snyk@1.1308.4 test --all-projects --detection-depth=4 --severity-threshold=high

  zap:
    name: OWASP ZAP API scan (not blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kitsuden
          POSTGRES_PASSWORD: kitsudenpassword
          POSTGRES_DB: kitsuden_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    # A throwaway test stack: fake secret, empty database, nothing real behind it.
    env:
      DATABASE_URL: postgres://kitsuden:kitsudenpassword@localhost:5432/kitsuden_test
      NODE_ENV: development
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://127.0.0.1:3100
      PORT: "3100"
      HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "9.15.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate, build and start the API
        working-directory: apps/api
        run: |
          bun run scripts/migrate.ts
          pnpm run build:node
          node dist-node/node-server.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/api/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          cat api.log; exit 1
      # Unauthenticated scan: it checks what anyone on the internet can reach.
      - uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://127.0.0.1:3100/api/docs/openapi.json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-O http://127.0.0.1:3100"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report

  owasp-dependency-check:
    name: OWASP Dependency-Check (when NVD_API_KEY is set, not blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DC_VERSION: "13.0.0"
      DC_SHA256: 44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed
    steps:
      - name: Is there a key?
        id: key
        env:
          KEY: ${{ secrets.NVD_API_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      # Its pnpm analyzer runs `pnpm audit` on the lockfile
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.key.outputs.present == 'true'
        with:
          version: "9.15.4"
      # The release zip, checked against its SHA-256, instead of the action's
      # floating `latest` image. Without an NVD key the database download takes hours.
      - name: Install Dependency-Check
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL -o dc.zip "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          echo "${DC_SHA256}  dc.zip" | sha256sum -c -
          unzip -q dc.zip -d "$RUNNER_TEMP"
      - name: Scan
        if: steps.key.outputs.present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project kitsuden --scan . --exclude "**/.git/**" \
            --nvdApiKey "$NVD_API_KEY" --failOnCVSS 7 \
            --format HTML --format SARIF --out dependency-check-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: dependency-check-report
          path: dependency-check-report
          retention-days: 14
